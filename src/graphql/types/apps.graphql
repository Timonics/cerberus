# =============================================================================
# Apps GraphQL schema.
#
# Apps are third-party integrations that get their own API key + bound
# organization. Registration is open in non-production and requires an
# admin API key in production (same ProductionAdminGuard as REST);
# key rotation / revocation require the app's own current credentials.
#
# V1.5 mirrors the REST surface at /v1/apps. The GraphQL path uses the
# same use-cases — RegisterAppUseCase, RotateAppApiKeyUseCase,
# RevokeAppUseCase, VerifyAppApiKeyUseCase.
# =============================================================================

# An App record. `defaultOrgSlug` is the org users register into when
# they sign up via this app's X-Cerberus-App-* headers.
type App {
  id: ID!
  name: String!
  description: String
  defaultOrgSlug: String
  contactEmail: String
  notes: String
  createdAt: String!
  revokedAt: String
}

# Input for registering a new app.
input RegisterAppInput {
  """Human-readable app name. 3-80 chars."""
  name: String!
  """Optional description."""
  description: String
  """Slug of the org that joining users will land in."""
  defaultOrgSlug: String
  """Contact email for the operator."""
  contactEmail: String
  """Free-form operator note (audit log only)."""
  notes: String
  """How long the first key lives, in seconds. Defaults to 1 year."""
  ttlSeconds: Int = 31536000
}

# Returned exactly once at registration. The plaintext API key is
# NEVER retrievable again — store it immediately.
type RegisterAppPayload {
  app: App!
  """Plaintext API key (43-char base64url). Shown ONLY here."""
  apiKey: String!
}

# Returned at key rotation. Same shape, same one-time disclosure.
type RotateAppKeyPayload {
  appId: ID!
  """Plaintext API key. Shown ONLY here."""
  apiKey: String!
}

extend type Mutation {
  """
  Register a new app + mint its first API key.

  V1.7 (audits C2/H-1): mirrors the REST `/v1/apps` gate — open in
  non-production; in production (or whenever
  `REQUIRE_ADMIN_FOR_REGISTRATION=true`) requires a valid admin API
  key bearer token, enforced by the same ProductionAdminGuard as the
  REST endpoint.
  """
  registerApp(input: RegisterAppInput!): RegisterAppPayload!

  """
  Mint a new API key for an existing app. The new key replaces the
  previous one; the old key still works until you call `revokeApp`
  to delete it (V1 limitation — V1.5 will auto-revoke).

  V1.7 (audit C2): requires the app's current credentials — the
  `X-Cerberus-App-Id` + `X-Cerberus-App-Secret` headers must verify
  against the app's live key, and the `id` argument must equal the
  `X-Cerberus-App-Id` header. Unauthenticated key rotation is
  rejected.
  """
  rotateAppKey(id: ID!, ttlSeconds: Int = 31536000): RotateAppKeyPayload!

  """
  Soft-revoke the app. Future requests with any of its keys fail.

  V1.7 (audit C2): same credential requirement as `rotateAppKey` —
  only the app itself (presenting its current valid key) can revoke
  itself.
  """
  revokeApp(id: ID!): Boolean!
}
