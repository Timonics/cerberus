# Engagement bounded context - GraphQL schema.
#
# Mirrors the REST `EngagementController` exposed at `/v1/engagement/*`.
# Includes email verification, password reset, and the user's own audit
# log. Admin-only audit-log views land in Phase 15 (Administration).

"""
Input for `Engagement.requestPasswordReset`. Always returns true
regardless of whether the email is registered — the server never
reveals account existence to an attacker.
"""
input RequestPasswordResetInput {
  """Email address of the user requesting the reset."""
  email: String!
}

"""
Input for `Engagement.confirmPasswordReset`. The user received the
`token` in an email; `newPassword` is the value they want to set.
"""
input ConfirmPasswordResetInput {
  """
  Plaintext token from the email link. Single-use. Expires after the
  configured TTL (default: 1 hour).
  """
  token: String!

  """The new password. 12–128 characters."""
  newPassword: String!
}

"""
Input for `Engagement.confirmEmailVerification`.
"""
input ConfirmEmailVerificationInput {
  """
  Plaintext token from the verification email. Single-use. Expires
  after the configured TTL (default: 24 hours).
  """
  token: String!
}

"""
The Engagement root query type.
"""
type Query {
  """
  The authenticated user's own audit log, most recent first.

  Limit is bounded server-side to 1–500 entries. Default: 100. This
  endpoint only returns the calling user's events — cross-user audit
  queries require admin scope (Phase 15).
  """
  myAuditLog(limit: Int = 100): [AuditLogEntry!]!
}

"""
The Engagement root mutation type.
"""
type Mutation {
  """
  Request a fresh email-verification token for the calling user.
  Always returns true.

  If the user already has an un-consumed token, it is revoked and a
  new one is issued. The plaintext token is sent via email through
  the configured mail sender — the HTTP/GraphQL response does NOT
  include it.
  """
  requestEmailVerification: Boolean!

  """
  Redeem an email-verification token. Sets `User.emailVerifiedAt`.

  Token is single-use; replay returns an error. Tokens also expire
  after 24 hours.
  """
  confirmEmailVerification(input: ConfirmEmailVerificationInput!): Boolean!

  """
  Request a password-reset token. Open to unauthenticated callers.

  Always returns true, even when the email is not registered — this
  prevents account-existence enumeration. If the email IS registered,
  a reset token is emailed (plaintext is NOT returned in the response).
  """
  requestPasswordReset(input: RequestPasswordResetInput!): Boolean!

  """
  Redeem a password-reset token and set a new password.

  Token is single-use; replay returns an error. Tokens also expire
  after 1 hour. On success, the auth context revokes all the user's
  live sessions.
  """
  confirmPasswordReset(input: ConfirmPasswordResetInput!): Boolean!
}

# =============================================================================
# Authenticated engagement endpoints (V1.5)
# =============================================================================

extend type Mutation {
  """
  Request a fresh email-verification token for the calling user.
  Always returns true; the token is sent via the configured mail
  sender, NOT returned in the response.
  """
  requestEmailVerification: Boolean!
}

"""
A single audit-log entry. Append-only — never updated, never deleted.
"""
type AuditLogEntry {
  id: ID!
  """Event type, e.g. `identity.user.registered`."""
  eventType: String!
  """User this event is attributed to (null for events with no user)."""
  userId: ID
  """Arbitrary JSON payload describing the event."""
  payload: String!
  """Originating IP at the time of the event, if recorded."""
  ipAddress: String
  """User-Agent at the time of the event, if recorded."""
  userAgent: String
  """Event timestamp (ISO-8601)."""
  occurredAt: String!
}

extend type Query {
  """
  The calling user's own audit log, most recent first.
  Server-side limit is bounded to 1–500.
  """
  auditLogMe(limit: Int = 100): [AuditLogEntry!]!
}